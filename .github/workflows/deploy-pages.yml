# Despliegue a Cloudflare Pages (proyecto maslexico-juez).
#
# Sustituye el `npm run pages:deploy` manual: cada push a `main` construye el
# sitio y lo publica como despliegue de producción. También puede lanzarse a
# mano desde la pestaña Actions (workflow_dispatch).
#
# Requiere dos secretos en el repositorio (Settings > Secrets and variables >
# Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta (Workers & Pages > Overview)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name maslexico-juez
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --pretty=%s)"
