# CI y despliegue a Cloudflare Pages (proyecto maslexico-juez).
#
# En cada push a `main`, en cada pull request y a mano desde la pestaña
# Actions: instala dependencias, ejecuta las pruebas y construye el sitio.
# Además publica `dist` como despliegue de producción cuando el evento es un
# push a `main` o un lanzamiento manual, y sólo si existen los secretos de
# Cloudflare. Sin ellos el despliegue se omite con un aviso, no con un fallo,
# así que el flujo se puede fusionar antes de configurarlos.
#
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta (Workers & Pages > Overview)
name: CI and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Cloudflare credentials
        id: cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Despliegue omitido::Faltan los secretos CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; el build pasó pero no se publicó."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name maslexico-juez
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --pretty=%s)"
