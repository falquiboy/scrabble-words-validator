
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/lovable-uploads/8314fb31-6b68-4d8c-af1b-7139fa2313c0.png" />
    <title>+Léxico</title>
    <meta name="description" content="Validador de palabras para juegos de mesa" />
    <meta name="theme-color" content="#9F9EA1" />
    <meta name="apple-mobile-web-app-title" content="+Léxico" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      body {
        overscroll-behavior-y: none;
        margin: 0;
        padding: 0;
      }
      
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #9F9EA1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
        padding-top: 10vh;
      }
      
      #splash-screen img {
        max-width: 80%;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
      }

      .loading-text {
        margin-top: 20px;
        color: white;
        font-size: 16px;
        text-align: center;
        font-family: Arial, sans-serif;
      }

      .progress-container {
        width: 80%;
        max-width: 300px;
        height: 8px;
        background-color: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        margin-top: 12px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background-color: white;
        border-radius: 4px;
        transition: width 0.3s ease;
      }
      
      .splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .loader {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 2px solid white;
        border-radius: 50%;
        border-top-color: transparent;
        animation: rotation 1s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <img src="/lovable-uploads/3a5a8e4f-456c-40df-b921-169d2ff52762.png" alt="+Léxico" />
      <div class="loading-text">
        <div class="loader"></div>
        <span id="loading-message">Cargando diccionario...</span> 
        <span id="loading-percentage">0%</span>
      </div>
      <div class="progress-container">
        <div id="loading-progress-bar" class="progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
