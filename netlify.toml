# Netlify configuration for React + Vite deployment
[build]
  # Directory to publish (Vite builds to 'dist' by default)
  publish = "dist"
  
  # Build command for Vite
  command = "npm run build"

  # This project moved to Cloudflare Pages. Never spend Netlify build credits,
  # even if the suspended Netlify team is reactivated later.
  ignore = "exit 0"

# ── Quetzal sub-app proxy ────────────────────────────────────────────────
# Quetzal (Svelte+WASM Scrabble client) is hosted on Cloudflare Pages
# (`https://quetzal-app.pages.dev/`) — moved from Netlify to escape the
# 100 GB/month bandwidth cap, since Pages offers unlimited egress on the
# free tier. The proxy URL `maslexico.app/quetzal/*` is preserved so any
# installed PWA or shared link keeps working without reinstall.
# This rule MUST come before the SPA fallback below.
#
# `splat` is empty for `/quetzal/`, so it forwards to `quetzal-app.pages.dev/quetzal/`
# which is Quetzal's own internal subpath (matching Vite's base = '/quetzal/').

[[redirects]]
  from = "/quetzal/*"
  to = "https://quetzal-app.pages.dev/quetzal/:splat"
  status = 200
  force = true

# Netlify's edge proxy does not forward Cross-Origin-Opener-Policy /
# Cross-Origin-Embedder-Policy from the upstream site, so we re-apply them
# locally. Without these headers `crossOriginIsolated` is false in the
# browser and SharedArrayBuffer (used by MAGPIE pthreads) is unavailable.
[[headers]]
  for = "/quetzal/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# Settings for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (if needed)
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--force"

# Branch deploy settings
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Staging branch configuration with password protection
[context."staging/test-features"]
  command = "npm run build"
  publish = "dist"
  
  [context."staging/test-features".environment]
    NODE_ENV = "staging"
