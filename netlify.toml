# Netlify configuration for React + Vite deployment
[build]
  # Directory to publish (Vite builds to 'dist' by default)
  publish = "dist"
  
  # Build command for Vite
  command = "npm run build"

# ── Quetzal sub-app proxy ────────────────────────────────────────────────
# Quetzal (Svelte+WASM Scrabble client) lives in its own Netlify site,
# `https://quetzal-app.netlify.app/`, and is exposed under maslexico.app/quetzal/
# via these rewrites. The bare /quetzal redirects to /quetzal/ for proper
# resolution of relative asset URLs in the manifest. The wildcard rewrite is
# a 200/force proxy so the user's browser stays on maslexico.app while the
# Quetzal Netlify site responds (with its own COOP/COEP headers needed for
# SharedArrayBuffer). These rules MUST come before the SPA fallback below.

[[redirects]]
  from = "/quetzal"
  to = "/quetzal/"
  status = 301
  force = true

[[redirects]]
  from = "/quetzal/*"
  to = "https://quetzal-app.netlify.app/quetzal/:splat"
  status = 200
  force = true

# Settings for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (if needed)
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--force"

# Branch deploy settings
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Staging branch configuration with password protection
[context."staging/test-features"]
  command = "npm run build"
  publish = "dist"
  
  [context."staging/test-features".environment]
    NODE_ENV = "staging"